services:
  postgres:
    image: postgres:16-alpine
    container_name: nanter-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanter}
      POSTGRES_DB: nanter
    volumes:
      - nanter_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanter -d nanter"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: nanter-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nanter:${POSTGRES_PASSWORD:-nanter}@postgres:5432/nanter
      PORT: "3000" # porta interna fixa; PORT do .env só escolhe a porta do host
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nanter_pg_data:
